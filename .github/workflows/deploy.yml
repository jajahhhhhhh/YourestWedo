name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Set the CLOUDFLARE_ACCOUNT_ID repository variable to deploy to a
          # different Cloudflare account. Falls back to the original account.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'aed56ccedac8bafaa6cc2551eea1cefe' }}
          wranglerVersion: "4"
          command: deploy
